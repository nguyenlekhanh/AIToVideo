# AI Video Generator — minimal pipeline
#
# Pipeline:
#   prompt -> Ollama (storyboard JSON) -> ComfyUI image -> ComfyUI video (LTX-Video)
#   -> Edge TTS narration -> FFmpeg final.mp4
#
# Python only orchestrates. No model inference in Python.
# No auto-download of models. Uses whatever is in ComfyUI/models/.

ollama:
  url: "http://127.0.0.1:11434"
  model: "qwen3:8b"
  # Vision model used only by --auto-ad to verify downloaded product images.
  vision_model: "qwen3-vl:8b"
  num_scenes: 3
  timeout: 180
  # Auto-ad planning can be slower than storyboard generation.
  planning_timeout: 600

comfyui:
  url: "http://127.0.0.1:8188"
  timeout: 60          # HTTP timeout per request (s)
  poll_interval: 2.0   # seconds between job status checks
  queue_timeout: 5400  # max seconds to wait for one ComfyUI job (LTX-2.5 is slow)

pipeline:
  duration: 5           # fallback seconds per scene (storyboard scene.duration wins)

tts:
  voice: "en-US-AriaNeural"
  rate: "+0%"
  pitch: "+0Hz"

ffmpeg:
  executable: "ffmpeg"
  ffprobe_executable: "ffprobe"
  crf: 19
  preset: "veryfast"

# Opt-in --auto-ad product research. Existing pipelines ignore this section.
product_ad:
  timeout: 30
  vision_timeout: 240
  max_image_bytes: 8000000
  # Local English TTS for auto-ad. Edge TTS may be blocked by its service;
  # Piper is the existing offline audio provider in this project.
  audio_model: "piper_en"
  voice: "en_US-amy-medium"
  # Fail rather than silently using page images that a vision model did not
  # confirm. Set false only for offline/testing use.
  require_vision_verification: true
